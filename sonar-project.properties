# Prefer CI variables for Sonar configuration:
sonar.projectKey=boundless-ppl_boundless-fe
sonar.organization=boundless-ppl
sonar.host.url=https://sonarcloud.io
sonar.sources=src
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
src/components/**,\
src/modules/**,\
src/hooks/**,\
src/lib/api-types.ts,\
src/lib/auth-context.tsx,\
src/lib/file-validation.ts,\
src/features/auth/context/**,\
src/features/auth/schemas/**,\
src/features/auth/types/**,\
src/features/globalmatch/services/recommendation.service.ts

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=boundless-fe
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
